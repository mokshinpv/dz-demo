apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: converter
  template:
    metadata:
      name: converter
      labels:
        component: converter
    spec:
      containers:
        - name: converter
          image: antonlarichev/conv-service:1.0
          env:
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: AMQP_USER
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: AMQP_PASSWORD
            - name: AMQP_EXCHANGE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: AMQP_EXCHANGE
            - name: AMQP_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: AMQP_HOSTNAME
            - name: AMQP_QUEUE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: AMQP_QUEUE
          resources:
            requests:
              memory: "400Mi"
              cpu: "200m"
            limits:
              memory: "400Mi"
              cpu: "200m"
