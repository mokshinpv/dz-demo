apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rabbitmq.name }}-secret
type: Opaque
data:
  AMQP_EXCHANGE: {{ "test" | b64enc }}
  AMQP_USER: {{ "rabbitmq" | b64enc }}
  AMQP_PASSWORD: {{ "bddfg2dff234a" | b64enc }}
  AMQP_HOSTNAME: {{ printf "%s-service" .Values.rabbitmq.name | b64enc }}
  AMQP_QUEUE: {{ "convert" | b64enc }}
